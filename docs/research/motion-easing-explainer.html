<div id="love-motion-easing-explainer">
  <div class="viz-controls">
    <button type="button" class="btn btn-primary" data-rate="1">同时播放</button>
    <button type="button" class="btn" data-rate="4">4 倍慢放</button>
  </div>
  <div class="text-small" data-status role="status" aria-live="polite">相同路程、相同时长 400ms，只比较速度曲线</div>
  <div class="motion-lane">
    <div>匀速 <span class="text-small">linear</span></div>
    <div class="motion-track"><span class="motion-dot" aria-hidden="true"></span></div>
  </div>
  <div class="motion-lane">
    <div>当前入场曲线 <span class="text-small">起步很猛，随后迅速减速</span></div>
    <div class="motion-track"><span class="motion-dot" aria-hidden="true"></span></div>
  </div>
  <div class="motion-lane">
    <div>候选标准曲线 <span class="text-small">短促加速，逐渐收住</span></div>
    <div class="motion-track"><span class="motion-dot" aria-hidden="true"></span></div>
  </div>
  <style>
    #love-motion-easing-explainer { color: var(--foreground); }
    #love-motion-easing-explainer .motion-lane { margin-top: 18px; }
    #love-motion-easing-explainer .motion-track { position: relative; height: 28px; margin-top: 8px; }
    #love-motion-easing-explainer .motion-track::before { content: ""; position: absolute; top: 12px; left: 0; right: 0; height: 4px; background: var(--muted); }
    #love-motion-easing-explainer .motion-dot { position: absolute; top: 4px; left: 0; width: 20px; height: 20px; border-radius: 6px; background: var(--viz-series-1); }
  </style>
  <script>
    (() => {
      const root = document.getElementById('love-motion-easing-explainer');
      const dots = [...root.querySelectorAll('.motion-dot')];
      const status = root.querySelector('[data-status]');
      const curves = ['linear', 'cubic-bezier(0.16, 1, 0.3, 1)', 'cubic-bezier(0.2, 0, 0, 1)'];
      let animations = [];
      let playId = 0;
      root.querySelectorAll('[data-rate]').forEach(button => button.addEventListener('click', async () => {
        const id = ++playId;
        animations.forEach(animation => animation.cancel());
        animations = [];
        const rate = Number(button.dataset.rate);
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        status.textContent = reduced ? '系统减少动态效果：显示终点' : `相同路程、相同时长 400ms，${rate === 4 ? '4 倍慢放' : '正常速度'}`;
        animations = dots.map((dot, index) => {
          const distance = Math.max(0, dot.parentElement.clientWidth - 20);
          return dot.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${distance}px)` }], {
            duration: reduced ? 1 : 400 * rate, easing: curves[index], fill: 'forwards'
          });
        });
        await Promise.all(animations.map(animation => animation.finished.catch(() => {})));
        if (id === playId && !reduced) status.textContent = '已到终点 · 相同时长仅用于比较曲线，不是卡片成品预览';
      }));
    })();
  </script>
</div>
