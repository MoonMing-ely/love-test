<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../css/style.css"><link rel="stylesheet" href="../../../css/content.css"><style>body{background:white}.demo{display:block;min-height:0;height:auto;padding:24px 20px 0;--quiz-option-border-reference-used:2px;--quiz-option-border-used:1px}.demo .quiz-panel{display:block;width:100%;margin:0}.demo .question-slot{--question-min-height:220px}#replay{display:block;margin:30px auto 8px;padding:9px 18px;border:1px solid var(--blue-gray);border-radius:12px;background:var(--surface-cool);color:var(--ink);cursor:pointer}#replay:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}</style></head><body><main class="home quiz-page demo"><section class="content-surface quiz-panel"><div class="question-stack"><div class="question-slot"><div class="question-ornament" aria-hidden="true"><span class="question-ornament-line"></span><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12Z" /></svg><span class="question-ornament-line"></span></div><p class="question-prompt">有人因为对方过去受过伤而反复包容，你更觉得主要是：</p></div></div></section></main><button id="replay" type="button">播放下一题</button><button id="reverse" type="button" style="display:block;margin:8px auto;padding:9px 18px;border:1px solid #b6cae9;border-radius:12px;background:white;color:#273144">播放上一题</button><script>const questionSlot=document.querySelector('.question-slot'),prompt=document.querySelector('.question-prompt'),panel=document.querySelector('.quiz-panel'),reduceMotion=matchMedia('(prefers-reduced-motion: reduce)'),buttons=[document.querySelector('#replay'),document.querySelector('#reverse')];let questionAnimation=null,index=0;const prompts=["有人因为对方过去受过伤而反复包容，你更觉得主要是：", "我一般不会先往坏处想，但若反复出现异常也会改变我的判断。"];  function stopQuestionAnimation() {
    questionAnimation?.cancel();
    questionAnimation = null;
  }

  function animateQuestion(phase, direction = 1) {
    stopQuestionAnimation();
    if (reduceMotion.matches || typeof questionSlot.animate !== "function") return;
    const leaving = phase === "out";
    const edge = { transform: `translate(${14 * direction * (leaving ? -1 : 1)}px, ${leaving ? -3 : 3}px)`, opacity: 0 };
    const rest = { transform: "none", opacity: 1 };
    // 前卡抽出／归位，底卡持续可见；不动画布局尺寸或累积持久样式。
    questionAnimation = questionSlot.animate(leaving ? [rest, edge] : [edge, rest], {
      duration: leaving ? 160 : 220,
      delay: leaving ? 90 : 0,
      easing: leaving ? "cubic-bezier(0.4, 0, 1, 1)" : "cubic-bezier(0.16, 1, 0.3, 1)",
      fill: leaving ? "forwards" : "none",
    });
  }

  reduceMotion.addEventListener?.("change", stopQuestionAnimation);

const play=direction=>{buttons.forEach(b=>b.disabled=true);panel.classList.add('is-answering');animateQuestion('out',direction);setTimeout(()=>{index=(index+direction+prompts.length)%prompts.length;prompt.textContent=prompts[index];panel.classList.remove('is-answering');animateQuestion('in',direction);setTimeout(()=>buttons.forEach(b=>b.disabled=false),230)},276)};buttons[0].addEventListener('click',()=>play(1));buttons[1].addEventListener('click',()=>play(-1));</script></body></html>
