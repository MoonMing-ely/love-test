<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../css/style.css"><link rel="stylesheet" href="../../../css/content.css"><style>body{background:white}.demo{display:block;min-height:0;height:auto;padding:24px 20px 0;--quiz-option-border-reference-used:2px;--quiz-option-border-used:1px}.demo .quiz-panel{display:block;width:100%;margin:0}.demo .question-slot{--question-min-height:220px}#replay{display:block;margin:30px auto 8px;padding:9px 18px;border:1px solid var(--blue-gray);border-radius:12px;background:var(--surface-cool);color:var(--ink);cursor:pointer}#replay:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}</style></head><body><main class="home quiz-page demo"><section class="content-surface quiz-panel"><div class="question-stack"><div class="question-slot"><div class="question-ornament" aria-hidden="true"><span class="question-ornament-line"></span><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12Z" /></svg><span class="question-ornament-line"></span></div><p class="question-prompt">有人因为对方过去受过伤而反复包容，你更觉得主要是：</p></div></div></section></main><button id="replay" type="button">播放过渡</button><script>const button=document.querySelector('#replay'),panel=document.querySelector('.quiz-panel');button.addEventListener('click',()=>{button.disabled=true;panel.classList.add('is-answering');setTimeout(()=>{panel.classList.remove('is-answering');setTimeout(()=>{button.disabled=false;},190);},276);});</script></body></html>
