<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>题干与选项字体调整</title><style>body{font:16px/1.6 system-ui;margin:24px;background:#fff;color:#273144}h1{font-size:24px}main{display:flex;gap:24px;align-items:flex-start;overflow:auto}figure{margin:0;min-width:300px}img{max-width:100%;height:auto;display:block;border:1px solid #ddd}select{font:inherit;padding:6px}p{max-width:80ch}</style><h1>题干与选项字体调整</h1><p>题干字号 +8%，实际字距 −10%；选项字重 +5%。所有横竖屏使用同一组调整系数，保留当前卡片层叠、内宽与自然换行。</p><p>已验证 10 个视口 × 96 道题：文字完整、左对齐、卡片边界、进度可达、重复 resize 稳定。200% 字体放大下 C10、C24、C02、A21 与选答动画也通过。题目源 Markdown、运行 JSON 和控制脚本未改。</p><label>视口 <select id="view"><option value="320x572">320 × 572</option><option value="360x640">360 × 640</option><option value="375x667">375 × 667</option><option value="390x844" selected>390 × 844</option><option value="430x932">430 × 932</option><option value="768x1024">768 × 1024</option><option value="1440x900">1440 × 900</option><option value="844x390">844 × 390</option><option value="899x900">899 × 900</option><option value="900x899">900 × 899</option></select></label><main><figure><figcaption>修改前 · C10</figcaption><img id="before" alt="修改前题目截图" src="before-390x844.png"></figure><figure><figcaption>修改后 · C10</figcaption><img id="after" alt="修改后题目截图" src="after-390x844.png"></figure></main><p><a href="after-C24-390x844.png">C24 修改后截图</a> · <a href="layout-results.json">布局验证数据</a> · <a href="enlarged-font-results.json">放大字体验证数据</a></p><script>document.querySelector('#view').addEventListener('change',e=>{for(const id of ['before','after'])document.querySelector('#'+id).src=id+'-'+e.target.value+'.png'})</script></html>
