<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>情感被骗指数测试</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="home" data-page="start">
      <div class="landscape-background" aria-hidden="true"></div>
      <nav class="top-actions" aria-label="快捷操作">
        <a
          class="image-slot"
          href="about.html?view=project&amp;from=index.html"
          data-route="about-project"
          aria-label="查看关于这个测试"
        ><span class="circle-icon circle-icon-feather" aria-hidden="true"></span></a>
        <a
          class="image-slot"
          href="about.html?view=result&amp;from=index.html"
          data-route="about-result"
          aria-label="查看关于测试结果"
        ><span class="circle-icon circle-icon-dots" aria-hidden="true"></span></a>
      </nav>

      <section class="content-frame" aria-label="首页主要内容">
        <div class="frame-side-glow" aria-hidden="true"></div>
        <div class="title-slot">
          <div class="title-card">
            <h1 class="title-copy">
              <img
                src="../assets/images/home-title.png"
                alt="测测你的情感被骗指数"
                width="1871"
                height="841"
              />
            </h1>
            <p class="home-test-info">共28题，大约4min</p>
          </div>
        </div>
        <div class="description-slot" aria-hidden="true"></div>
        <a
          class="primary-action"
          href="text.html?restart=1"
          data-route="start-test"
          aria-label="开始测试"
        ><span>开始测试</span></a>
      </section>
    </main>
    <script src="../js/interactions/about-navigation-stack.js"></script>
    <script src="../js/interactions/page-transition.js"></script>
  </body>
</html>
