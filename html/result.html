<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>情感被骗指数测试结果</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/content.css" />
  </head>
  <body>
    <main class="home info-page result-page" data-page="result">
      <nav class="top-actions" aria-label="结果页导航">
        <a class="image-slot" href="about.html?view=project&amp;from=result.html" data-route="about-project" aria-label="查看关于这个测试"></a>
        <a class="image-slot" href="about.html?view=result&amp;from=result.html" data-route="about-result" aria-label="查看关于测试结果"></a>
      </nav>

      <section class="content-frame result-frame" aria-label="测试结果区域">
        <div class="result-content" tabindex="0" aria-label="最终分数与各层算法数据" hidden>
          <h1 id="result-title"></h1>
          <p id="result-score" class="final-score" hidden></p>
          <p id="result-summary"></p>
          <div id="result-layers" class="result-layers"></div>
        </div>
        <div class="result-empty" hidden>
          <h1>还没有完成测试</h1>
          <p>完成 28 道随机题目后，这里会显示测试状态。</p>
        </div>
        <div class="result-actions">
          <a class="info-action result-action" href="text.html?restart=1">重测一次</a>
          <button class="info-action result-action" id="share-result" type="button">分享结果</button>
        </div>
        <p id="share-status" class="share-status" role="status" data-html2canvas-ignore></p>
      </section>
    </main>
    <dialog class="share-preview" id="share-preview" aria-labelledby="share-preview-title">
      <h2 id="share-preview-title">结果截图</h2>
      <p id="share-preview-status" role="status">完整结果已生成，可保存图片后手动分享，也可长按图片保存。</p>
      <div class="share-preview-image"><img id="share-image" alt="本次测试的完整结果截图" /></div>
      <div class="share-preview-actions">
        <a class="info-action" id="save-result-image">保存图片</a>
        <button class="info-action" id="share-result-image" type="button" hidden>分享图片</button>
        <button class="info-action" id="close-share-preview" type="button" autofocus>关闭</button>
      </div>
    </dialog>
    <script src="../js/interactions/result.js"></script>
    <script src="../js/vendor/html2canvas-1.4.1.min.js"></script>
    <script src="../js/interactions/result-share.js"></script>
    <script src="../js/interactions/about-navigation-stack.js"></script>
    <script src="../js/interactions/page-transition.js"></script>
  </body>
</html>
